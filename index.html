<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recensement Identity Provider</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Recensement Identity Provider</h1>

    <!-- Section de connexion -->
    <div class="login-section">
      <h2>Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Entrez votre email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" placeholder="Entrez votre mot de passe" required>
        </div>
        <button type="button" id="login-btn" class="btn">Se connecter</button>
      </form>
      <p id="output"></p>
    </div>

    <!-- Section pour afficher les connexions -->
    <div class="logins-section">
      <h2>Historique des connexions</h2>
      <button id="show-logins-btn" class="btn">Afficher les connexions</button>
      <ul id="logins-list" class="logins-list"></ul>
    </div>
  </div>
</body>
</html>
