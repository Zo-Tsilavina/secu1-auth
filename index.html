<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Firebase Auth Example</h1>

    <div>
        <h2>Public Endpoint</h2>
        <button id="public-endpoint-btn">Access Public Endpoint</button>
        <p id="public-output"></p>
    </div>

    <div>
        <h2>Private Endpoint</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button id="private-endpoint-btn">Access Private Endpoint</button>
        <p id="private-output"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
